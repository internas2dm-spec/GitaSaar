plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gitasaar.reader'
    compileSdk 36

    defaultConfig {
        // IMPORTANT: Use a unique package ID before first Play Store release.
        applicationId 'com.gitasaar.reader'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Configure your own release signing key before uploading AAB to Play Store.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
